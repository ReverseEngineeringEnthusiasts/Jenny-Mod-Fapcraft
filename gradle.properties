# Cleanroom dev runs (runClient/runServer). The shippable jar is still built by
# the Maven build in build.sh, which uses the local lib/ + lib-repo/ artifacts.
org.gradle.configuration-cache = true
org.gradle.jvmargs = -Xmx3G

# Cleanroom loader version used by runClient/runServer.
cleanroom_version = 0.7.14-alpha

# Dev account name in the run.
minecraft_username = Developer
